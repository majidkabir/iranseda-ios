name: IranSeda
options:
  bundleIdPrefix: com.majidkabir
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IranSeda:
    type: application
    platform: iOS
    sources:
      - IranSeda
      - Shared
    dependencies:
      - target: IranSedaWidget
      - target: IranSedaWatch
    entitlements:
      path: IranSeda/IranSeda.entitlements
      properties:
        com.apple.security.application-groups: [group.com.majidkabir.iranseda]
    info:
      path: IranSeda/Info.plist
      properties:
        CFBundleDisplayName: Seda+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CarPlay audio scene; inactive until the entitlement is added (docs/CARPLAY.md).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        # sedaplus://open?id=... is how the widget asks the app to play something.
        CFBundleURLTypes:
          - CFBundleURLName: com.majidkabir.iranseda
            CFBundleURLSchemes: [sedaplus]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.iranseda
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  IranSedaWidget:
    type: app-extension
    platform: iOS
    sources:
      - IranSedaWidget
      - Shared
    entitlements:
      path: IranSedaWidget/IranSedaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.majidkabir.iranseda]
    info:
      path: IranSedaWidget/Info.plist
      properties:
        CFBundleDisplayName: Seda+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.iranseda.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Apple Watch app. It ships inside the iPhone app but runs on its own (no iPhone needed).
  IranSedaWatch:
    type: application
    platform: watchOS
    sources:
      - IranSedaWatch
      - path: IranSeda/Core
        excludes: [CarPlay.swift]
      - path: IranSeda/UI/Common.swift
      - Shared
    info:
      path: IranSedaWatch/Info.plist
      properties:
        CFBundleDisplayName: Seda+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.majidkabir.iranseda
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.iranseda.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  IranSeda:
    build:
      targets:
        IranSeda: all
  IranSedaWatch:
    build:
      targets:
        IranSedaWatch: all
