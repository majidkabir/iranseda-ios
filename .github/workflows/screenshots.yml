name: Screenshots

# Pushing to a ui/* branch builds the app, opens each screen with demo data in the
# simulator and publishes the pictures to the `screenshots` branch.

on:
  push:
    branches: ['ui/**']

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick and boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pro=[x for x in c if x['name'].endswith('Pro')]
          print((pro or c)[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project IranSeda.xcodeproj -scheme IranSeda \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/IranSeda.app
      - name: Capture
        env:
          SCREENS: home empty radio channel hub detail serial episodes search player playerlive library downloads recents settings
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=com.majidkabir.iranseda
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/IranSeda.app
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$UDID" $BUNDLE 2>/dev/null || true
            xcrun simctl launch "$UDID" $BUNDLE -demo YES -screen "$1"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$2.png"
          }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for screen in $SCREENS; do shoot "$screen" "$mode-$screen"; done
          done
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-large
          for screen in home radio detail player search; do shoot "$screen" "xl-$screen"; done
          ls -la shots
      - name: Publish to screenshots branch
        run: |
          for f in shots/*.png; do sips -Z 1100 "$f" >/dev/null; done
          SHA=${GITHUB_SHA::7}
          mkdir /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_SHA" > SOURCE
          git add -A && git commit -qm "Screenshots for $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
